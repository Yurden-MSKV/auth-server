<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
</head>
<body>
    <main>
        <div class="login_box">
            <form method="post" class="login_form">
                {% csrf_token %}
                <div class="input_block">
                    <label for="id_username">Никнейм:</label>
                    <input type="text" name="username" class="form_control" id="id_username" required>
                </div>
                <div class="input_block">
                    <label for="id_password1">Пароль:</label>
                    <input type="password" name="password1" class="form_control" id="id_password1" required>
                </div>
                <div class="input_block">
                    <label for="id_password2">Повтор пароля:</label>
                    <input type="password" name="password2" class="form_control" id="id_password2" required>
                </div>
                <div class="btn_block">
                    <button class="login_btn" type="submit">Зарегистрироваться</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
