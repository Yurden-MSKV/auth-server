{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <title>{{ request.user.username }} — auth-сервер</title>
    <link rel="stylesheet" href="{% static 'css/profile_page.css' %}">
</head>
<body>
    <main>
        <img class="user_pic" src="{{ user.avatar_url }}" alt="Аватар">
        <div class="user_info">
            <div class="info_top">
                <h2>{{ user.username }}</h2>
                <a href="{% url 'profile_edit' %}">
                    <img class="icon" src="{% static 'icons/edit.svg' %}">
                </a>
            </div>
             <div class="user_more">
                <p>{{ user.bio }}</p>
             </div>
        </div>

    </main>
</body>
</html>
