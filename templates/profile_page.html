{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <title>{{ request.user.username }} — auth-сервер</title>
    <link rel="stylesheet" href="{% static 'css/profile_page.css' %}">
</head>
<body>
    <main>
        <div class="user_top">
            <img class="user_pic" src="{{ user.avatar_url }}" alt="Аватар">
            <div class="user_info">
                <p>{{ user.username }}</p>
                <a href="{% url 'profile_edit' %}">Изменить</a>
            </div>
        </div>
    </main>
</body>
</html>
